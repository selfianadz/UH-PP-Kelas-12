const show=id=>['login','exam','result'].forEach(x=>$(x).classList.toggle('hide',x!==id));
function start(){const n=$('nm').value.trim(),k=$('kl').value.trim(),c=$('kd').value.trim().toUpperCase();
if(!n||!k)return $('er').textContent='Isi nama dan kelas.';if(c!==CODE)return $('er').textContent='Kode masuk salah.';
S={n,k,order:shuffle(D.map(q=>q.id)).slice(0,N),ans:{},cur:0,end:Date.now()+DUR*1000,done:false};save();run()}
function run(){clearInterval(T);show('exam');draw();tick();T=setInterval(tick,1000)}
function tick(){const r=Math.max(0,Math.round((S.end-Date.now())/1000));$('tm').textContent=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');$('tm').className=r<300?'l':'';if(r<=0)finish(true)}
function draw(){const id=S.order[S.cur],q=D.find(x=>x.id===id);$('pg').textContent='Soal '+(S.cur+1)+' / '+N+' \u00b7 Peringatan '+(S.w||0)+'/'+MAXW;$('qt').textContent=q.q;
$('op').innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='o'+(S.ans[id]===i?' on':'');
const l=document.createElement('i');l.textContent='ABCDE'[i]+'.';const s=document.createElement('span');s.textContent=t;b.append(l,s);
b.onclick=()=>{S.ans[id]=i;save();draw()};$('op').appendChild(b)});
$('gr').innerHTML='';S.order.forEach((x,i)=>{const b=document.createElement('button');b.textContent=i+1;b.className=(S.ans[x]!==undefined?'d ':'')+(i===S.cur?'cu':'');b.onclick=()=>{S.cur=i;save();draw();scrollTo(0,0)};$('gr').appendChild(b)})}
function go(d){S.cur=Math.min(N-1,Math.max(0,S.cur+d));save();draw();scrollTo(0,0)}
function finish(auto){const kosong=N-Object.keys(S.ans).length;
if(!auto&&!confirm(kosong?kosong+' soal belum dijawab. Yakin kumpulkan sekarang?':'Yakin kumpulkan jawaban?'))return;
clearInterval(T);let b=0;S.order.forEach(id=>{const q=D.find(x=>x.id===id);if(S.ans[id]===(q.a^(id*7+3)))b++});
S.done=true;S.res={b,k:kosong,at:new Date().toLocaleString('id-ID')};save();result()}
function result(){const r=S.res;show('result');$('rn').textContent=S.n+' \u2022 Kelas '+S.k;$('sc').textContent=Math.round(r.b*100/N*10)/10;
$('rb').textContent=r.b;$('rs').textContent=N-r.b-r.k;$('rk').textContent=r.k;$('rx').textContent=(S.tw||0)+' kali';$('ru').textContent=(S.rs||0)+' kali';$('rt').textContent=r.at}
function viol(){if(!S||S.done)return;S.away=false;S.w=(S.w||0)+1;S.tw=(S.tw||0)+1;
if(S.w>MAXW){S.order=shuffle(D.map(q=>q.id)).slice(0,N);S.ans={};S.cur=0;S.end=Date.now()+DUR*1000;S.w=0;S.rs=(S.rs||0)+1;save();run();
setTimeout(()=>alert('Kamu keluar dari halaman ujian lagi. Ujian diulang dari awal dengan soal baru dan waktu 25 menit.'),300)}
else{save();run();setTimeout(()=>alert('PERINGATAN '+S.w+'/'+MAXW+': jangan keluar dari halaman ujian. Jika keluar lagi, ujian diulang dari awal.'),300)}}
document.addEventListener('visibilitychange',()=>{if(!S||S.done||$('exam').classList.contains('hide'))return;if(document.hidden){S.away=true;save()}else if(S.away)viol()});
try{S=JSON.parse(localStorage.getItem('uh12'))}catch(e){}
if(S){if(S.done)result();else if(Date.now()>=S.end)run();else viol()}
</script></body></html>
